<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Core - Stats</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
      <div class="site-logo">Training Core</div>
      <nav class="site-nav" aria-label="Main navigation">
        <ul class="site-nav-list">
          <li><a href="index.html" class="site-nav-link">Home</a></li>
          <li><a href="workouts.html" class="site-nav-link">Workouts</a></li>
          <li>
            <a
              href="stats.html"
              class="site-nav-link site-nav-link--active"
              aria-current="page"
              >Stats</a
            >
          </li>
        </ul>
      </nav>

      <button
        class="theme-toggle-btn"
        id="theme-toggle-btn"
        aria-label="Toggle dark mode"
      >
        🌙
      </button>
    </header>

    <main id="main-content" class="page-main">
      <section class="stats-summary-section">
        <h1 class="page-title">Your Progress</h1>

        <div class="stats-summary-grid">
          <div class="stats-summary-card">
            <span class="stats-summary-value" id="total-workouts-value">0</span>
            <span class="stats-summary-label">Total Workouts</span>
          </div>

          <div class="stats-summary-card">
            <span class="stats-summary-value" id="total-sets-value">0</span>
            <span class="stats-summary-label">Total Sets Logged</span>
          </div>

          <div class="stats-summary-card">
            <span class="stats-summary-value" id="total-reps-value">0</span>
            <span class="stats-summary-label">Total Reps Logged</span>
          </div>
        </div>
      </section>

      <section class="stats-chart-section">
        <h2 class="section-title">Progress Over Time</h2>
        <div class="stats-chart-container" id="stats-chart-container">
          <canvas id="progress-chart"></canvas>
        </div>
      </section>

      <section class="achievements-section">
        <h2 class="section-title">Achievements</h2>
        <div class="achievements-grid" id="achievements-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Training Core</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/main.js" defer></script>
    <script src="js/stats.js" defer></script>
  </body>
</html>
