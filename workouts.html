<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Core - Workouts</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
      <div class="site-logo">Training Core</div>
      <nav class="site-nav" aria-label="Main navigation">
        <ul class="site-nav-list">
          <li><a href="index.html" class="site-nav-link">Home</a></li>
          <li>
            <a
              href="workouts.html"
              class="site-nav-link site-nav-link--active"
              aria-current="page"
              >Workouts</a
            >
          </li>
          <li><a href="stats.html" class="site-nav-link">Stats</a></li>
        </ul>
      </nav>

      <button
        class="theme-toggle-btn"
        id="theme-toggle-btn"
        aria-label="Toggle dark mode"
      >
        🌙
      </button>
    </header>

    <main id="main-content" class="page-main">
      <div class="api-error-banner" id="api-error-banner" role="alert" hidden>
        Unable to connect to the server. Please make sure the backend is running
        and try again.
      </div>

      <section class="workout-form-section">
        <h1 class="page-title">Your Workouts</h1>

        <form class="workout-form" id="workout-form" novalidate>
          <div class="form-group">
            <label for="exercise-name" class="form-label">Exercise Name</label>
            <input
              type="text"
              id="exercise-name"
              name="exerciseName"
              class="form-input"
              required
              aria-describedby="exercise-name-error"
              aria-invalid="false"
            />
            <span
              class="form-error-message"
              id="exercise-name-error"
              role="alert"
            ></span>
          </div>

          <div class="form-group">
            <label for="exercise-sets" class="form-label">Sets</label>
            <input
              type="number"
              id="exercise-sets"
              name="exerciseSets"
              class="form-input"
              min="1"
              required
              aria-describedby="exercise-sets-error"
              aria-invalid="false"
            />
            <span
              class="form-error-message"
              id="exercise-sets-error"
              role="alert"
            ></span>
          </div>

          <div class="form-group">
            <label for="exercise-reps" class="form-label">Reps</label>
            <input
              type="number"
              id="exercise-reps"
              name="exerciseReps"
              class="form-input"
              min="1"
              required
              aria-describedby="exercise-reps-error"
              aria-invalid="false"
            />
            <span
              class="form-error-message"
              id="exercise-reps-error"
              role="alert"
            ></span>
          </div>

          <div class="form-group">
            <label for="exercise-weight" class="form-label">Weight (kg)</label>
            <input
              type="number"
              id="exercise-weight"
              name="exerciseWeight"
              class="form-input"
              min="0"
              step="0.5"
              aria-describedby="exercise-weight-error"
              aria-invalid="false"
            />
            <span
              class="form-error-message"
              id="exercise-weight-error"
              role="alert"
            ></span>
          </div>

          <button type="submit" class="form-submit-btn">Add Workout</button>
        </form>
      </section>

      <section class="random-workout-section">
        <h2 class="section-title">Need Inspiration?</h2>
        <button class="random-workout-btn" id="random-workout-btn">
          Generate Random Workout
        </button>
        <ul class="random-workout-list" id="random-workout-list"></ul>
      </section>

      <section class="workout-list-section">
        <h2 class="section-title">Logged Workouts</h2>
        <ul class="workout-list" id="workout-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Training Core</p>
    </footer>

    <script src="js/main.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/workouts.js" defer></script>
  </body>
</html>
